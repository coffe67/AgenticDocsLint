# Default configuration for SlideForge

section_rules:
  Introduction:
    keywords: [intro, overview, background, motivation]
  Methodology:
    keywords: [method, methodology, approach, pipeline, data, model]
  Results:
    keywords: [results, findings, accuracy, metrics, evaluation]
  Conclusion:
    keywords: [conclusion, summary, next steps, future work]

required_keywords:
  Introduction: [goal, motivation]
  Methodology: [data, model, training]
  Results: [accuracy, evaluation]
  Conclusion: [summary, next steps]

# Global keyword policy (preferred):
# When present, the pipeline applies these across the entire document (not per section).
# If empty or omitted, it will fall back to section-based checks above.
required_keywords_global: [goal, motivation, data, model, training, accuracy, evaluation, summary, next steps]

# Keywords that should not appear in the document; presence triggers update recommendations.
forbidden_keywords: []

thresholds:
  coverage_pass: 0.8
  coverage_needs_update: 0.5

strict:
  require_all_sections: true
  # Average coverage per required section must meet this
  min_per_section_coverage: 0.6
  # Each slide should meet at least this coverage (when keywords exist)
  min_slide_coverage: 0.4
  # Minimum confidence to accept a section tag; below is considered unassigned
  min_section_confidence: 0.5
  # Minimum slides per section (optional)
  min_slides_per_section:
    Methodology: 1
    Results: 1
  # Whether slides with no/low-confidence section should trigger updates
  disallow_unassigned: true
  # If true, section avg below min causes FAIL; if false, it's a NEEDS_UPDATE
  fail_on_section_avg_below: true
parser:
  backend: builtin  # options: builtin, paper2slides
  paper2slides:
    # Command should output structured deck JSON to stdout
    # Example placeholder; replace with your Paper2Slides CLI
    command: "paper2slides --input {input} --output-format json"
    output: stdout  # or a file path template like {tmp}/deck.json

orchestrator: builtin  # options: builtin, julep

# LLM configuration (optional)
tagger:
  mode: heuristic  # options: heuristic, llm
llm:
  provider: ""      # e.g., openai
  model: ""         # e.g., gpt-4o-mini
  # api_key: ""     # or use env var OPENAI_API_KEY / LLM_API_KEY
  timeout_s: 30
  max_tokens: 256
